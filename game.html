<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SASA Solutions | Multiplayer Draw & Guess</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- PASTE YOUR SASA SOLUTIONS NAVBAR HERE -->

    <section class="section-padding" style="background: var(--bg-light); min-height: 80vh;">
        <div class="container">
            <h2 class="section-title">Draw & Guess Showcase</h2>
            <p class="section-subtitle">A live multiplayer demo built by SASA Solutions.</p>
            
            <!-- NEW: Room Selection Lobby -->
            <div id="lobbyContainer" style="background: var(--white); padding: 40px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); max-width: 500px; margin: 0 auto; text-align: center;">
                <h3 style="color: var(--primary-color); margin-bottom: 20px;">Welcome to SASA Draw!</h3>
                
                <input type="text" id="playerNameInput" placeholder="Enter Your Name" class="form-input" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px;" required>
                
                <div style="display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;">
                    <button id="showCreateBtn" class="btn-primary" style="flex: 1;">Create Room</button>
                    <button id="showJoinBtn" class="btn-primary" style="flex: 1; background: #28a745;">Join Room</button>
                </div>

                <!-- Hidden Join Room Details -->
                <div id="joinRoomDetails" style="display: none; margin-top: 15px;">
                    <input type="text" id="roomIdInput" placeholder="Enter 4-Letter Room ID" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; text-transform: uppercase;" maxlength="4">
                    <button id="joinSubmitBtn" class="btn-primary" style="width: 100%; background: #28a745;">Join Game Now</button>
                    <p id="joinError" style="color: red; margin-top: 10px; display: none;"></p>
                </div>
            </div>

            <!-- The Game Container (HIDDEN BY DEFAULT NOW) -->
            <div id="mainGameContainer" class="game-container" style="display: none;">
                
                <div style="width: 100%; text-align: center; margin-bottom: 10px;">
                    <h3 style="color: var(--text-light);">Room ID: <span id="displayRoomId" style="color: var(--primary-color); letter-spacing: 2px;"></span></h3>
                </div>

                <div id="wordSelectionArea" style="width: 100%; text-align: center; margin-bottom: 15px;">
                    <button id="startTurnBtn" class="btn-primary">Start My Turn</button>
                    <div id="wordChoices" style="display: none; gap: 10px; justify-content: center; margin-top: 10px;"></div>
                    <h3 id="currentWordDisplay" style="color: var(--primary-color); display: none; margin-top: 10px;"></h3>
                </div>

                <div class="canvas-container">
                    <div class="toolbar">
                        <input type="color" id="colorPicker" value="#0b3d91">
                        <input type="range" id="brushSize" min="1" max="20" value="5">
                        <button id="clearBtn" class="btn-primary" style="padding: 5px 15px;">Clear Canvas</button>
                    </div>
                    <canvas id="gameCanvas" width="800" height="500"></canvas>
                </div>

                <div class="chat-container">
                    <ul id="messages"></ul>
                    <form id="chatForm">
                        <input id="chatInput" autocomplete="off" placeholder="Guess the word..." required />
                        <button type="submit" class="btn-primary" style="border-radius: 0 4px 4px 0;">Send</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- PASTE YOUR SASA SOLUTIONS FOOTER HERE -->

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
